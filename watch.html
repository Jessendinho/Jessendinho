<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JESSENDINHO™️ — Watch Live</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#080808;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

/* HEADER */

header{
    height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5%;
    background:#111;
    border-bottom:1px solid #222;
}

.logo img{
    width:44px;
    height:44px;
    object-fit:cover;
    display:block;
}

/* HOME BUTTON */

.home{
    color:#bbb;
    text-decoration:none;
    font-size:14px;
}

.home:hover{
    color:#fff;
}

/* MAIN */

.container{
    width:min(1100px,94%);
    margin:30px auto;
}

/* PLAYER */

.player{
    width:100%;
    aspect-ratio:16 / 9;
    background:#000;
    border:1px solid #222;
    border-radius:10px;
    overflow:hidden;
}

.player iframe{
    width:100%;
    height:100%;
    display:block;
    border:0;
}

/* LIVE STATUS */

.live-status{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:14px;
    color:#bbb;
    font-size:14px;
}

.live-dot{
    width:9px;
    height:9px;
    background:#e50914;
    border-radius:50%;
    display:inline-block;
}

/* INFO */

.info{
    padding:25px 0;
}

h1{
    margin:0 0 10px;
    font-size:28px;
}

.description{
    color:#aaa;
    line-height:1.6;
    max-width:750px;
}

/* FOOTER */

footer{
    text-align:center;
    color:#666;
    padding:40px 20px;
    border-top:1px solid #222;
    margin-top:30px;
}

/* MOBILE */

@media(max-width:600px){

    header{
        padding:0 4%;
    }

    .container{
        width:94%;
        margin:20px auto;
    }

    h1{
        font-size:23px;
    }

    .description{
        font-size:14px;
    }

    .live-status{
        font-size:13px;
    }

}

</style>
</head>

<body>

<header>

    <a href="index.html" class="logo">
        <img src="jessendinho-logo.png" alt="JESSENDINHO™️">
    </a>

    <a href="index.html" class="home">
        ← Home
    </a>

</header>


<main class="container">

    <!-- LIVE PLAYER -->

    <div class="player">

        <iframe
            src="https://owncast-rq1yq-u78472.vm.elestio.app/embed/video"
            allowfullscreen>
        </iframe>

    </div>


    <!-- STREAM STATUS -->

    <div class="live-status">

        <span class="live-dot"></span>

        <strong>JESSENDINHO™️ Live</strong>

    </div>


    <!-- INFORMATION -->

    <section class="info">

        <h1>
            JESSENDINHO™️ Live
        </h1>

        <p class="description">
            Welcome to the official JESSENDINHO™️ live streaming experience.
            Watch football, gaming, entertainment and special events — all in one place.
        </p>

    </section>

</main>


<footer>

    © 2026 JESSENDINHO™️ — All Rights Reserved

</footer>

</body>

</html>
