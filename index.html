<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JESSENDINHO™️ — Your World. Your Entertainment.</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#060606;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

a{
  text-decoration:none;
  color:inherit;
}

/* HEADER */
header{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 5%;
  background:#080808;
  border-bottom:1px solid #202020;
}

.logo img{
  width:50px;
  height:50px;
  object-fit:cover;
  display:block;
}

.watch-button{
  background:#e50914;
  padding:12px 21px;
  border-radius:6px;
  font-size:13px;
  font-weight:900;
  letter-spacing:.5px;
}

.watch-button:hover{
  background:#ff1b26;
}

/* HERO */
.hero{
  min-height:560px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:60px 20px 70px;
  background:
    radial-gradient(circle at 50% 35%,#202020 0%,#0b0b0b 38%,#060606 72%);
}

.hero-content{
  max-width:1050px;
}

.hero-brand{
  font-size:clamp(50px,10vw,105px);
  font-weight:1000;
  letter-spacing:-6px;
  line-height:.9;
  margin-bottom:24px;
}

.hero-title{
  font-size:clamp(35px,6.5vw,72px);
  font-weight:900;
  letter-spacing:-3px;
  line-height:.98;
  text-transform:uppercase;
}

.hero-title span{
  color:#e50914;
}

.hero-text{
  max-width:650px;
  margin:24px auto 32px;
  color:#999;
  font-size:16px;
}

.buttons{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}

.primary,
.secondary{
  padding:14px 25px;
  border-radius:6px;
  font-size:13px;
  font-weight:900;
}

.primary{
  background:#e50914;
}

.primary:hover{
  background:#ff1b26;
}

.secondary{
  background:#151515;
  border:1px solid #444;
}

.secondary:hover{
  border-color:#777;
}

/* LIVE */
.live{
  width:min(1150px,92%);
  margin:auto;
  padding:65px 0 75px;
}
